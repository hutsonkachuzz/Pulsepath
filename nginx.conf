# ==============================================================================
# PULSEPATH - PRODUCTION NGINX REVERSE PROXY CONFIGURATION
# Location: /etc/nginx/sites-available/pulsepath
# ==============================================================================

server {
    listen 80;
    server_name our-pulsepath.com www.our-pulsepath.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name our-pulsepath.com www.our-pulsepath.com;

    # SSL Certificate paths (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/our-pulsepath.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/our-pulsepath.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Max upload size for photo memories
    client_max_body_size 20M;

    # 1. Frontend Static Files (Built SPA in /var/www/pulsepath/dist)
    location / {
        root /var/www/pulsepath/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|webp|svg|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # 2. Backend REST API Reverse Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 3. Real-Time Couple Chat WebSockets
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 4. Uploaded Photos & Media Storage
    location /uploads/ {
        alias /var/www/pulsepath/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }
}
