<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulsePath ❤️ Our Private Space</title>
    <style>
        body {
            background-color: #0d0d12;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #fff;
        }
        .container {
            background: linear-gradient(135deg, #1e1b2e, #121019);
            border: 1px solid #ff4b5c55;
            padding: 40px;
            border-radius: 24px;
            width: 440px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            text-align: center;
        }
        h1 {
            color: #fff;
            margin-bottom: 8px;
            font-size: 26px;
        }
        p {
            color: #ffccd5;
            font-size: 14px;
            line-height: 1.6;
        }
        .badge {
            display: inline-block;
            background: rgba(255, 75, 92, 0.2);
            border: 1px solid #ff4b5c88;
            color: #ff758c;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 20px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 25px;
        }
        .action-btn {
            display: block;
            padding: 13px;
            background: linear-gradient(135deg, #ff4b5c, #ff758c);
            border-radius: 10px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }
        .action-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .secondary-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="badge">❤️ Welcome to Our Private World</span>
        <h1>பாஸ்வேர்ட் சரிபார்க்கப்பட்டது!</h1>
        <p>நீங்கள் வெற்றிகரமாக எங்கள் தனிப்பட்ட உலகத்திற்குள் நுழைந்துவிட்டீர்கள்.</p>
        
        <div class="btn-group">
            <a href="/home" class="action-btn">🏠 முகப்புப் பக்கம் (Home Dashboard)</a>
            <a href="/chat" class="action-btn">💬 தனிப்பட்ட சாட் (Private Chat)</a>
            <a href="/space-login.html" class="action-btn secondary-btn">🔒 மீண்டும் லாக் செய்ய (Lock Space)</a>
        </div>
    </div>
</body>
</html>
