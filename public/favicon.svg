<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- Background subtle dark rounded container -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140E20" />
      <stop offset="100%" stop-color="#090510" />
    </linearGradient>

    <!-- Glowing Heart & Ribbon Gradient: Pink to Magenta to Violet -->
    <linearGradient id="heartPinkViolet" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FF5D8F" />
      <stop offset="35%" stop-color="#FF2A7A" />
      <stop offset="70%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Glass Highlight Reflection -->
    <linearGradient id="glassGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- ECG Line Glow Gradient -->
    <linearGradient id="ecgGlowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFAAC5" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E9D5FF" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="ambientGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#FF2A7A" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Rounded-Square App Container -->
  <rect width="128" height="128" rx="30" fill="url(#bgGrad)" stroke="#FF4D8D" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Flowing Ribbon / Lower Path (Loops forming the infinity / shared journey base) -->
  <g filter="url(#ambientGlow)">
    <!-- Back Loop / Flowing Path -->
    <path 
      d="M32 82 C22 92, 38 104, 64 94 C90 104, 106 92, 96 82 C86 72, 74 80, 64 87 C54 80, 42 72, 32 82 Z" 
      fill="none" 
      stroke="url(#heartPinkViolet)" 
      stroke-width="7" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      opacity="0.85"
    />

    <!-- Main Intertwined Heart Body -->
    <!-- Left Heart Lobe & Flow -->
    <path
      d="M64 42 C58 28, 38 22, 28 34 C16 48, 24 70, 48 88 L64 100 L80 88 C104 70, 112 48, 100 34 C90 22, 70 28, 64 42 Z"
      fill="none"
      stroke="url(#heartPinkViolet)"
      stroke-width="8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Intertwined Secondary Inner Heart Contour -->
    <path
      d="M64 48 C60 38, 46 34, 38 42 C30 52, 36 68, 54 82 L64 90 L74 82 C92 68, 98 52, 90 42 C82 34, 68 38, 64 48 Z"
      fill="none"
      stroke="#FF7597"
      stroke-width="2.5"
      stroke-opacity="0.6"
      stroke-linecap="round"
    />

    <!-- Flowing Front Ribbon / Path crossing through the base -->
    <path
      d="M26 80 C26 96, 50 102, 64 91 C78 102, 102 96, 102 80 C102 68, 86 64, 64 78 C42 64, 26 68, 26 80 Z"
      fill="none"
      stroke="url(#heartPinkViolet)"
      stroke-width="6.5"
      stroke-linecap="round"
      opacity="0.9"
    />

    <!-- Central Glowing Heartbeat / ECG Line -->
    <path
      d="M28 62 L48 62 L54 50 L60 76 L66 42 L72 70 L78 62 L100 62"
      fill="none"
      stroke="url(#ecgGlowGrad)"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Glass Specular Highlight (Top Curves) -->
    <path
      d="M32 32 C38 25, 48 26, 56 34"
      fill="none"
      stroke="url(#glassGloss)"
      stroke-width="3"
      stroke-linecap="round"
    />
    <path
      d="M72 34 C80 26, 90 25, 96 32"
      fill="none"
      stroke="url(#glassGloss)"
      stroke-width="3"
      stroke-linecap="round"
    />
  </g>
</svg>
