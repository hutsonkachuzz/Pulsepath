<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0813" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PulsePath" />
    <meta name="description" content="PulsePath — A private romantic digital world that belongs only to two people. Save memories, share thoughts, and celebrate your journey." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/pulsepath-app-icon.png" />

    <title>PulsePath ❤️ Our Private World</title>
    <script>
      (function() {
        function setVh() {
          var vh = window.innerHeight * 0.01;
          document.documentElement.style.setProperty('--vh', vh + 'px');
        }
        setVh();
        window.addEventListener('resize', setVh, { passive: true });
        window.addEventListener('orientationchange', setVh, { passive: true });
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', setVh, { passive: true });
        }
      })();
    </script>
  </head>
  <body class="bg-[#120914] text-white selection:bg-rose-500 selection:text-white antialiased overflow-hidden m-0 p-0 h-[100dvh] w-full">
    <div id="root" class="w-full h-[100dvh] overflow-hidden m-0 p-0 bg-[#120914]"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
